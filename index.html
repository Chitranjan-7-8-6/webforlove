<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Proposal</title>
    <style>
        body {
            /* Better background handling */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url("https://picsum.photos/id/1015/1600/900");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: white;
            font-size: clamp(1.8rem, 8vw, 3.5rem);
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            padding: 0 10px;
        }

        .button-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            width: 100%;
            min-height: 150px; /* Space for moving button */
        }

        button {
            font-size: clamp(1rem, 4vw, 1.4rem);
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        #yesBtn {
            background: #ff4757;
            color: white;
            box-shadow: 0 0 15px #ff4757;
            animation: glow 1.5s infinite alternate;
            z-index: 10;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px #ff4757; transform: scale(1); }
            to { box-shadow: 0 0 25px #ff0000; transform: scale(1.05); }
        }

        #noBtn {
            background: #2f3542;
            color: white;
            /* Yahan se absolute hataya gaya hai shuruat ke liye */
            transition: 0.1s; 
        }

        #teaseMessage {
            margin-top: 25px;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            display: none;
        }

        #successScreen {
            display: none;
            color: white;
            font-size: clamp(1.5rem, 7vw, 3rem);
            font-weight: bold;
            padding: 20px;
            text-shadow: 0 0 20px #ff0000;
        }

        .heart {
            position: fixed;
            z-index: 999;
            animation: float 3s linear forwards;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="mainScreen">
        <h1>Are you falling in my Love ??</h1>
        <div class="button-container">
            <button id="yesBtn" onclick="sayYes()">Yes 😎</button>
            <button id="noBtn" onmouseover="moveNoButton()" ontouchstart="moveNoButton()" onclick="moveNoButton()">
                No 😠
            </button>
        </div>
        <div id="teaseMessage"></div>
    </div>

    <div id="successScreen">
        CONGRATULATIONS! <br> YOU MADE THE RIGHT DECISION 😍❤️
    </div>

    <audio id="yesSound" preload="auto">
        <source src="https://www.myinstants.com/media/sounds/tada-fanfare.mp3" type="audio/mpeg">
    </audio>

    <script>
        const noBtn = document.getElementById("noBtn");
        const teaseMessage = document.getElementById("teaseMessage");
        const funnyMessages = [
            "Really? Not interested? 😒",
            "Nice try, click Yes! 🤡",
            "Think again... 🫡",
            "Don't be shy, say YES! 😎",
            "No is not an option! 😈",
            "You're making a mistake! 😠",
            "Are you sure about that? 😏",
            "Don't be shy, say YES! 😎",
            "Click YES and fall in love! 😍"
        ];
        let messageIndex = 0;

        function playSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 600;
                oscillator.type = "sine";
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.2);
            } catch(e) { console.log("Audio play blocked"); }
        }

        function moveNoButton() {
            playSound();
            // Laptop ke liye padding (50px) rakhi hai taaki button screen se chipke nahi
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50);

            noBtn.style.position = "fixed";
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;

            teaseMessage.style.display = "inline-block";
            teaseMessage.innerText = funnyMessages[messageIndex];
            messageIndex = (messageIndex + 1) % funnyMessages.length;
        }

        function sayYes() {
            let sound = document.getElementById("yesSound");
            sound.play().catch(e => console.log("Sound error"));
            document.getElementById("mainScreen").style.display = "none";
            document.getElementById("successScreen").style.display = "block";
            createHearts();
        }

        function createHearts() {
            for (let i = 0; i < 50; i++) {
                let heart = document.createElement("div");
                heart.className = "heart";
                heart.innerHTML = "❤️";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.top = "100vh";
                heart.style.fontSize = (Math.random() * 30 + 20) + "px";
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }
        }
    </script>
